# Grafana datasource provisioning: local SQLite telemetry database.
# Uses the frser-sqlite-datasource plugin (installed by deploy/pi-grafana-setup.sh).
apiVersion: 1

datasources:
  - name: PiTelemetry
    uid: pitelemetry-sqlite
    type: frser-sqlite-datasource
    access: proxy
    isDefault: true
    jsonData:
      path: /home/mikandro/telemetry-pi/data/telemetry.sqlite
    version: 1
    editable: true
