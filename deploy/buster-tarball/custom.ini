# Grafana config for the no-sudo tarball install on the throwaway Buster card.
# Everything lives under the user's home dir; Grafana runs as the same user
# that writes the SQLite db, so no shared group / WAL permission handling is
# needed. The proper apt + systemd install (deploy/pi-grafana-setup.sh) is for
# the 64-bit reflash target.

[paths]
provisioning = /home/mikandro/telemetry-pi/deploy/buster-tarball/provisioning

[server]
http_port = 3000

[analytics]
reporting_enabled = false
check_for_updates = false

[log]
level = info
